<title>Ritim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@500..800&display=swap">
<style>
/* Layout: one-column phone app — big header, pill-organizer week strip, progress ring card, time-of-day groups of large tappable rows, floating labelled tab bar. All sizes in rem so the "Yazı boyutu" setting scales everything. Built for older eyes: large type, strong contrast, words next to every icon. */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --surface-2:#E4E8E0; --line:#D3D9CE;
  --ink:#141A16; --muted:#4B5650; --faint:#78837C;
  --acc-l:#2F55E4; --acc-d:#8FA8FF; --accent:var(--acc-l); --on-accent:#FFFFFF;
  --ok:#11784F; --warn:#9A5B00; --danger:#C2382C; --flame:#D4610F;
  --overlay:rgb(14 20 17 / .45);
  --shadow:0 1px 2px rgb(24 32 27 / .06), 0 10px 28px -12px rgb(24 32 27 / .2);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:var(--f-body);
  --r:1.25rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1210; --surface:#171E1B; --surface-2:#222B27; --line:#323D38;
    --ink:#EEF3F0; --muted:#B4BEB8; --faint:#87928C;
    --accent:var(--acc-d); --on-accent:#0B1020;
    --ok:#4FCB94; --warn:#EDB04E; --danger:#FF8073; --flame:#FFA05A;
    --overlay:rgb(0 0 0 / .62);
    --shadow:0 0 0 1px rgb(255 255 255 / .04);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#171E1B; --surface-2:#222B27; --line:#323D38;
  --ink:#EEF3F0; --muted:#B4BEB8; --faint:#87928C;
  --accent:var(--acc-d); --on-accent:#0B1020;
  --ok:#4FCB94; --warn:#EDB04E; --danger:#FF8073; --flame:#FFA05A;
  --overlay:rgb(0 0 0 / .62);
  --shadow:0 0 0 1px rgb(255 255 255 / .04);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:17px}
#app{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:.6rem}
svg.i{width:1.25rem;height:1.25rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:.9rem;font-weight:700;color:var(--muted)}

/* splash */
.splash{height:100%;display:grid;place-items:center;gap:.8rem;align-content:center}
.splash .mark{font:800 2.8rem/1 var(--f-display);letter-spacing:-.03em}
.dots{display:flex;gap:.4rem}
.dots span{width:.65rem;height:1.4rem;border-radius:.4rem;background:var(--surface-2);animation:fill 1.4s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.12s}.dots span:nth-child(3){animation-delay:.24s}.dots span:nth-child(4){animation-delay:.36s}.dots span:nth-child(5){animation-delay:.48s}
@keyframes fill{0%,100%{background:var(--surface-2)}40%{background:var(--accent)}}

/* auth */
.auth{height:100%;overflow-y:auto;padding:1.6rem 16px 2.5rem}
.auth-in{max-width:26rem;margin:0 auto;display:grid;gap:1.3rem}
.brand{display:grid;gap:.5rem;padding-top:.5rem}
.brand .mark{font:800 3.6rem/.95 var(--f-display);letter-spacing:-.04em}
.brand .mark em{font-style:normal;color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:1.05rem;max-width:30ch}
.pillbox-demo{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.pillbox-demo div{display:grid;gap:.3rem;justify-items:center}
.pillbox-demo b{font-size:.75rem;font-weight:700;color:var(--muted)}
.pillbox-demo i{display:block;width:100%;height:2.6rem;border-radius:.75rem;background:var(--surface-2);position:relative;overflow:hidden}
.pillbox-demo i::after{content:"";position:absolute;inset:auto 0 0 0;height:var(--h);background:var(--accent);border-radius:inherit;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes rise{from{height:0}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.auth-card{padding:1.2rem;display:grid;gap:1rem}
.seg{display:flex;background:var(--surface-2);border-radius:.9rem;padding:.25rem;gap:.25rem}
.seg button{flex:1;padding:.65rem .5rem;border-radius:.7rem;font-weight:700;font-size:.95rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.field{display:grid;gap:.35rem}
.field>label,.lbl{font-size:.95rem;font-weight:700;color:var(--ink)}
.inp{width:100%;font-size:max(16px,1.05rem);font-weight:600;padding:.8rem .9rem;border-radius:.8rem;border:2px solid var(--line);background:var(--bg);outline:none;transition:border-color .15s;min-height:3.1rem}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--faint);font-weight:500}
textarea.inp{min-height:5rem;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1.1rem) 52%,calc(100% - .8rem) 52%;background-size:.35rem .35rem;background-repeat:no-repeat;padding-right:2.2rem}
.pw{position:relative}
.pw .inp{padding-right:3.2rem}
.pw button{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);width:2.6rem;height:2.6rem;display:grid;place-items:center;color:var(--muted);border-radius:.6rem}
.row{display:flex;align-items:center;gap:.6rem}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.1rem;min-height:3.1rem;border-radius:.9rem;font-weight:800;font-size:1.05rem;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:.55rem .9rem;min-height:2.6rem;font-size:.95rem;border-radius:.75rem}
.link{color:var(--accent);font-weight:800;font-size:.95rem;padding:.3rem 0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.err{color:var(--danger);font-size:.95rem;font-weight:700}
.err:empty{display:none}
.note{font-size:.9rem;color:var(--muted);display:flex;gap:.5rem;align-items:flex-start;margin:0}
.note svg{margin-top:.15rem;width:1.05rem;height:1.05rem}
.check-row{display:flex;align-items:center;gap:.6rem;font-size:1rem;font-weight:600;color:var(--ink);cursor:pointer;min-height:2.6rem}
.check-row input{width:1.3rem;height:1.3rem;accent-color:var(--accent)}
.quick-acc{display:flex;gap:.5rem;flex-wrap:wrap}
.quick-acc button{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem .35rem .35rem;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.9rem}

/* shell */
.shell{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:640px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 16px .6rem}
.top h1{font-size:1.85rem;line-height:1.1;font-weight:800}
.top .eyebrow{margin-bottom:.2rem}
.avatar{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;font:800 1.1rem var(--f-display);color:#fff;background:var(--c,var(--accent));flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--line)}
.avatar.sm{width:1.9rem;height:1.9rem;font-size:.85rem;box-shadow:none}
.view{overflow-y:auto;overflow-x:hidden;padding:.25rem 16px calc(8.5rem + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.stack{display:grid;gap:1.1rem}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;z-index:20;padding:.5rem 10px calc(.6rem + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.tabbar-in{display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;align-items:end;background:var(--surface);border-radius:1.5rem;box-shadow:var(--shadow);border:1px solid var(--line);padding:.35rem .3rem .45rem}
.tab{display:grid;justify-items:center;gap:.15rem;font-size:.8rem;font-weight:800;color:var(--muted);padding:.4rem 0;border-radius:.9rem;min-height:3.4rem;align-content:center}
.tab svg{width:1.5rem;height:1.5rem}
.tab[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.fab-wrap{display:grid;justify-items:center;gap:.15rem;font-size:.8rem;font-weight:800;color:var(--ink)}
.fab{width:3.6rem;height:3.6rem;border-radius:1.25rem;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-1.6rem;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:1.75rem;height:1.75rem;stroke-width:2.6}

/* pillbox week strip */
.week{display:grid;grid-template-columns:2.2rem 1fr 2.2rem;align-items:center;gap:.2rem}
.week-nav{width:2.2rem;height:3rem;display:grid;place-items:center;color:var(--ink);border-radius:.7rem}
.week-nav svg{width:1.4rem;height:1.4rem}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;background:var(--surface);padding:.35rem;border-radius:1.1rem;box-shadow:var(--shadow)}
.wd{display:grid;justify-items:center;gap:.05rem;padding:.4rem 0 .45rem;border-radius:.8rem;position:relative;overflow:hidden;isolation:isolate;min-width:0}
.wd .n{font:800 1.1rem var(--f-display);line-height:1.15}
.wd .d{font-size:.72rem;font-weight:800;color:var(--muted)}
.wd .lvl{position:absolute;inset:auto 0 0 0;height:var(--h,0%);background:color-mix(in srgb,var(--accent) 20%,transparent);z-index:-1;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.wd.full .lvl{background:color-mix(in srgb,var(--accent) 32%,transparent)}
.wd.today .n,.wd.today .d{color:var(--accent)}
.wd[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wd[aria-pressed="true"] .d,.wd[aria-pressed="true"].today .n,.wd[aria-pressed="true"].today .d{color:var(--bg)}
.wd[aria-pressed="true"] .lvl{background:color-mix(in srgb,var(--bg) 24%,transparent)}
.wd .pip{width:.3rem;height:.3rem;border-radius:50%;background:currentColor;opacity:.55;margin-top:.1rem}
.wd .pip.off{opacity:0}

/* progress hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.1rem;align-items:center;padding:1.1rem}
.ring{width:6.2rem;height:6.2rem;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font:800 1.55rem var(--f-display);letter-spacing:-.02em}
.ring .val small{font-size:.9rem;font-weight:800;color:var(--muted)}
.hero h2{font-size:1.35rem;line-height:1.2}
.hero p{margin:.25rem 0 0;color:var(--muted);font-size:1rem;font-weight:600}
.badges{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem .25rem .45rem;border-radius:999px;font-size:.88rem;font-weight:800;background:var(--surface-2)}
.badge svg{width:1rem;height:1rem}
.badge.flame{color:var(--flame);background:color-mix(in srgb,var(--flame) 13%,transparent)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}

.alert{display:flex;gap:.75rem;align-items:center;padding:.85rem 1rem;border-radius:1rem;background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--ink);font-size:1rem;cursor:pointer;border:2px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert svg{color:var(--warn);width:1.5rem;height:1.5rem}
.alert b{font-weight:800}

/* task items */
.sec{display:grid;gap:.5rem}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 .25rem}
.sec-h h3{display:flex;align-items:center;gap:.45rem;font-size:1.15rem;font-weight:800}
.sec-h h3 svg{width:1.3rem;height:1.3rem;color:var(--muted)}
.sec-h span{font-size:.9rem;font-weight:700;color:var(--muted)}
.list{display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;align-items:center;padding:.85rem 1rem;cursor:pointer;position:relative;transition:background .15s;min-height:4.4rem}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.check{width:2.75rem;height:2.75rem;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;color:transparent;transition:background .2s,color .2s,transform .15s;position:relative;background:var(--surface)}
.check::after{content:"";position:absolute;inset:-.5rem}
.check svg{width:1.45rem;height:1.45rem;stroke-width:3.2}
.check:active{transform:scale(.88)}
.is-done .check{background:var(--c);color:#fff}
.is-skip .check{border-style:dashed;opacity:.6}
.check.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.item-main{min-width:0}
.item-title{font-weight:800;font-size:1.12rem;line-height:1.3;overflow-wrap:anywhere;display:flex;gap:.4rem;align-items:center}
.item-title .star{width:1.05rem;height:1.05rem;color:var(--warn);fill:var(--warn)}
.is-done .item-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--faint)}
.item-meta{display:flex;flex-wrap:wrap;gap:.2rem .7rem;font-size:.92rem;font-weight:600;color:var(--muted);margin-top:.2rem;align-items:center}
.item-meta span{display:inline-flex;align-items:center;gap:.25rem}
.item-meta svg{width:.95rem;height:.95rem}
.time{font-weight:800;color:var(--ink);background:var(--surface-2);padding:.05rem .45rem;border-radius:.4rem}
.is-now .time{background:var(--accent);color:var(--on-accent)}
.is-now::before{content:"";position:absolute;left:0;top:.8rem;bottom:.8rem;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.overdue .time{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.m-flame{color:var(--flame);font-weight:800}
.m-low{color:var(--warn);font-weight:800}
.m-done{color:var(--ok);font-weight:800}
.m-late{color:var(--danger);font-weight:800}
.m-star{color:var(--warn);font-weight:800}
.m-star svg{fill:var(--warn)}
.check:not([aria-pressed="true"]){color:color-mix(in srgb,var(--c) 40%,transparent)}
.is-star{background:color-mix(in srgb,var(--warn) 6%,transparent)}
.do-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.55rem .95rem;min-height:2.75rem;border-radius:999px;font-weight:800;font-size:.98rem;background:var(--accent);color:var(--on-accent);white-space:nowrap;transition:transform .1s}
.do-btn:active{transform:scale(.95)}
.do-btn.on{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.do-btn svg{width:1.1rem;height:1.1rem;stroke-width:3}
.is-skip .do-btn{background:var(--surface-2);color:var(--muted)}
.cat-ic{width:2.4rem;height:2.4rem;border-radius:.8rem;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.cat-ic svg{width:1.25rem;height:1.25rem}
.cat-ic.lg{width:3.2rem;height:3.2rem;border-radius:1rem}
.cat-ic.lg svg{width:1.6rem;height:1.6rem}

.empty{padding:1.8rem 1.2rem;text-align:center;display:grid;gap:.75rem;justify-items:center}
.empty h3{font-size:1.35rem}
.empty p{margin:0;color:var(--muted);max-width:32ch;font-size:1rem}
.tpl-grid{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.tpl{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1rem .6rem .75rem;border-radius:999px;background:var(--surface-2);font-weight:800;font-size:.98rem;min-height:2.8rem;transition:background .15s}
.tpl:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}
.tpl svg{width:1.15rem;height:1.15rem;color:var(--accent)}
.done-toggle{display:flex;align-items:center;gap:.4rem;margin:0 auto;font-size:.95rem;font-weight:800;color:var(--ink);padding:.6rem 1.1rem;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);min-height:2.8rem}

/* calendar */
.cal{padding:.9rem}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.cal-h h2{font-size:1.35rem}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:.8rem;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:1.4rem;height:1.4rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}
.cal-dow{font-size:.78rem;font-weight:800;text-align:center;color:var(--muted);padding:.25rem 0}
.cd{aspect-ratio:1;max-width:100%;border-radius:.75rem;display:grid;place-items:center;position:relative;font:800 1.02rem var(--f-display);isolation:isolate;overflow:hidden}
.cd.out{opacity:.3}
.cd .f{position:absolute;inset:auto 0 0 0;height:var(--h,0%);background:color-mix(in srgb,var(--accent) 24%,transparent);z-index:-1}
.cd.full .f{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.cd.today{box-shadow:inset 0 0 0 2.5px var(--accent)}
.cd[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cd[aria-pressed="true"] .f{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.cd .cnt{position:absolute;bottom:.25rem;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cd .cnt i{width:.25rem;height:.25rem;border-radius:50%;background:currentColor;opacity:.5}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.85rem;font-weight:600;color:var(--muted);margin-top:.6rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{width:.8rem;height:.8rem;border-radius:.25rem;display:inline-block}

/* tasks view */
.search{position:relative}
.search svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:2.7rem;background:var(--surface);border-color:transparent;box-shadow:var(--shadow)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:2px 16px .4rem;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;min-height:2.6rem;border-radius:999px;font-weight:800;font-size:.92rem;background:var(--surface);border:2px solid var(--line);color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:.55rem;height:.55rem;border-radius:50%;background:var(--c)}
.chip .ct{font-size:.8rem;opacity:.7}
.tcard .item-meta .next{color:var(--ink);font-weight:800}
.paused-tag{font-size:.78rem;font-weight:800;padding:.1rem .5rem;border-radius:.4rem;background:var(--surface-2);color:var(--muted)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.tile{padding:.9rem 1rem;display:grid;gap:.1rem}
.tile .v{font:800 2rem/1.05 var(--f-display);letter-spacing:-.02em}
.tile .v small{font-size:1rem;color:var(--muted);font-weight:800}
.tile .k{font-size:.9rem;font-weight:800;color:var(--muted)}
.panel{padding:1rem;display:grid;gap:.8rem}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.panel-h h3{font-size:1.1rem}

// ---------- storage layer (claude.ai db when available, otherwise this device) ----------

// ---------- crypto ----------
const enc = new TextEncoder();

const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

// ---------- session ----------
function readSession() {

  }

}

}

// ---------- accounts ----------
async function loadAccounts() {
  const doc = await Store.get('accounts');
  S.accounts = (doc && Array.isArray(doc.list)) ? doc.list : [];
}
async function saveAccounts() { await Store.raw('accounts', { kind: 'accounts', list: S.accounts }); }
const findUser = u => S.accounts.find(a => a.username === String(u || '').trim().toLowerCase());
const publicAcc = a => a && ({ id: a.id, name: a.name, username: a.username, color: a.color });

async function doRegister(f) {
  const name = f.name.trim(), username = f.username.trim().toLowerCase();
  if (name.length < 2) throw 'Adını en az 2 harf olacak şekilde yaz.';
  if (!/^[a-z0-9_.]{3,20}$/.test(username)) throw 'Kullanıcı adı 3–20 karakter olmalı; harf, rakam, nokta ve alt çizgi kullanabilirsin.';
  if (f.pw.length < 6) throw 'Şifre en az 6 karakter olmalı.';
  if (f.pw !== f.pw2) throw 'Şifreler birbiriyle eşleşmiyor.';
  await loadAccounts();
  if (findUser(username)) throw 'Bu kullanıcı adı alınmış. Başka bir tane dene.';

    id: rid('a'), name, username, alg, salt, hash: await hashPw(f.pw, salt, alg),
    rsalt, rhash: await hashPw(normCode(code), rsalt, alg),
    color: CAT_COLORS[S.accounts.length % CAT_COLORS.length], created: Date.now(),
  };

  await saveAccounts();
  return { acc, code };
}
let failCount = 0;
async function doLogin(username, pw) {

  await loadAccounts();

  if (!acc || (await hashPw(pw, acc.salt, acc.alg)) !== acc.hash) { failCount++; throw 'Kullanıcı adı veya şifre hatalı.'; }
  failCount = 0;

}

}

// ---------- data model ----------
function defaultApp() {
  return {
    tasks: [], cats: clone(DEFAULT_CATS),
    settings: { theme: 'system', accent: 'kobalt', fontSize: 'normal', hideDone: false, sound: true, vibrate: true, remind: true },

function normTask(p = {}) {
  const t0 = today(), d = parse(t0);
  const base = {
    id: rid('t'), title: '', note: '', cat: (S.data && S.data.cats[0] ? S.data.cats[0].id : 'c_kisisel'), priority: 0,

}
const task = id => S.data.tasks.find(t => t.id === id);
const cat = id => S.data.cats.find(c => c.id === id) || { id: '', name: 'Genel', color: '#7C8D35', icon: 'tag' };
const slotsOf = t => t.times.length ? t.times : [null];

function occursOn(t, s) {
  if (t.archived) return false;
  const r = t.rec;
  if (r.type === 'once') return s === (t.doneOn || r.date);
  if (t.paused) return false;
  if (s < t.start || (t.end && s > t.end)) return false;
  const d = parse(s), every = Math.max(1, r.every || 1);
  switch (r.type) {
    case 'daily': return diffDays(t.start, s) % every === 0;
    case 'weekly': {
      if (!r.days.includes(d.getDay())) return false;
      if (every === 1) return true;
      return Math.round(diffDays(mondayOf(t.start), mondayOf(s)) / 7) % every === 0;
    }
    case 'monthly': {
      const sd = parse(t.start);
      const months = (d.getFullYear() - sd.getFullYear()) * 12 + d.getMonth() - sd.getMonth();
      if (months % every) return false;
      const last = dim(d.getFullYear(), d.getMonth());
      return d.getDate() === (r.mday === -1 ? last : Math.min(r.mday, last));
    }
    case 'yearly': {
      if (d.getMonth() !== r.month) return false;
      return d.getDate() === Math.min(r.day, dim(d.getFullYear(), r.month));
    }
  }
  return false;
}
function nextOcc(t, from = today(), n = 1) {
  if (t.rec.type === 'once') {
    const r = t.doneOn || t.archived ? null : (t.rec.date < from ? from : t.rec.date);
    return n === 1 ? r : (r ? [r] : []);
  }
  const out = []; let s = from;
  for (let k = 0; k < 800 && out.length < n; k++) { if (occursOn(t, s)) out.push(s); s = addDays(s, 1); }

}
function recLabel(t, withTimes = true) {
  const r = t.rec, e = Math.max(1, r.every || 1);
  let s;
  switch (r.type) {
    case 'once': s = 'Bir kez · ' + fmtShort(r.date); break;
    case 'daily': s = e === 1 ? 'Her gün' : `${e} günde bir`; break;
    case 'weekly': {
      const ds = [...r.days].sort((a, b) => WEEK.indexOf(a) - WEEK.indexOf(b));
      let dl = ds.length === 7 ? 'her gün' : ds.join() === '1,2,3,4,5' ? 'hafta içi' : ds.join() === '6,0' ? 'hafta sonu' : ds.map(x => DAY3[x]).join(', ');
      s = e === 1 ? (ds.length === 7 ? 'Her gün' : dl.charAt(0).toLocaleUpperCase('tr') + dl.slice(1)) : `${e} haftada bir · ${dl}`;
      break;
    }
    case 'monthly': s = (e === 1 ? 'Her ay' : `${e} ayda bir`) + ' · ' + (r.mday === -1 ? 'son gün' : r.mday + '. gün'); break;

    case 'weekly': return n * r.days.length / 7 / e;

function dayItems(s, withOverdue = true) {
  const items = [];
  for (const t of S.data.tasks) {
    if (occursOn(t, s)) slotsOf(t).forEach((time, i) => items.push({ t, i, time, key: t.id + '.' + i, v: hv(s, t.id + '.' + i), date: s }));
  }
  const td = today();
  if (withOverdue && s === td) {
    for (const t of S.data.tasks) {
      if (t.rec.type === 'once' && !t.doneOn && !t.archived && t.rec.date < td)
        items.push({ t, i: 0, time: t.times[0] || null, key: t.id + '.0', v: undefined, date: td, overdue: true });
    }
  }
  items.sort((a, b) => (b.overdue ? 1 : 0) - (a.overdue ? 1 : 0) || (a.time || '99') .localeCompare(b.time || '99') || b.t.priority - a.t.priority || a.t.created - b.t.created);
  return items;
}
function dayStats(s) {
  let exp = 0, done = 0;
  for (const it of dayItems(s, false)) { if (it.v === 's') continue; exp++; if (isDone(it.v)) done++; }
  return { exp, done, ratio: exp ? done / exp : 0 };
}
function occState(t, s) {
  const vals = slotsOf(t).map((_, i) => hv(s, t.id + '.' + i));
  const doneN = vals.filter(isDone).length;
  if (vals.every(v => v === 's')) return 'skip';
  if (vals.every(v => v)) return 'done';
  return doneN ? 'part' : 'miss';
}
function taskStreak(t) {
  if (t.rec.type === 'once') return 0;
  const td = today(); let s = td, n = 0;
  for (let k = 0; k < 500; k++) {
    if (s < t.start) break;
    if (occursOn(t, s)) {
      const st = occState(t, s);
      if (st === 'done') n++;
      else if (st !== 'skip' && s !== td) break;
    }
    s = addDays(s, -1);
  }
  return n;
}
function bestStreak(t) {
  if (t.rec.type === 'once') return 0;
  const td = today(); let s = t.start < addDays(td, -730) ? addDays(td, -730) : t.start, best = 0, cur = 0;
  while (s <= td) {
    if (occursOn(t, s)) {
      const st = occState(t, s);
      if (st === 'done') { cur++; best = Math.max(best, cur); }
      else if (st !== 'skip' && s !== td) cur = 0;
    }
    s = addDays(s, 1);
  }
  return best;
}
function taskRate(t, days = 30) {
  const td = today(); let exp = 0, done = 0;
  for (let k = 0; k < days; k++) {
    const s = addDays(td, -k);
    if (s < t.start || !occursOn(t, s)) continue;
    slotsOf(t).forEach((time, i) => { const v = hv(s, t.id + '.' + i); if (v === 's') return; if (s === td && !isDone(v) && !(time && time < nowHM())) return; exp++; if (isDone(v)) done++; });
  }
  return exp ? done / exp : null;
}
function perfectStreak() {
  const td = today(); let s = td, n = 0;
  for (let k = 0; k < 400; k++) {
    const st = dayStats(s);
    if (st.exp > 0) { if (st.done >= st.exp) n++; else if (s !== td) break; }
    s = addDays(s, -1);
  }
  return n;
}

function saveApp() {

  S.appTimer = setTimeout(() => { S.appTimer = null; Store.write('app_' + S.me.id, { kind: 'app', acct: S.me.id, ...S.data }); }, 250);

function adjustStock(t, dir) {
  if (!t.stock.on) return;
  t.stock.qty = Math.max(0, Math.round((t.stock.qty + dir * (t.stock.per || 1)) * 100) / 100);
  if (dir < 0 && t.stock.qty <= t.stock.low) toast(`${t.title}: ${t.stock.qty} adet kaldı. Yenilemeyi unutma.`);
}
function toggleSlot(id, i, date, btn) {
  const t = task(id); if (!t) return;
  const key = id + '.' + i, v = hv(date, key);
  if (isDone(v)) {
    setHv(date, key, null);
    if (t.rec.type === 'once') t.doneOn = null;
    adjustStock(t, +1);
  } else {
    setHv(date, key, nowHM());
    if (t.rec.type === 'once') t.doneOn = date;
    adjustStock(t, -1);
    feedback();
  }
  saveApp();
  render();
  if (!isDone(v)) {
    const nb = $(`.item[data-key="${CSS.escape(key)}"][data-date="${date}"] .check`);
    if (nb) nb.classList.add('pop');
    const st = dayStats(date);
    if (date === today() && st.exp && st.done === st.exp && !S.celebrated[date]) { S.celebrated[date] = 1; confetti(); toast('Bugünün tüm görevleri tamam. Harika gidiyorsun!'); }
  }
}
function skipDay(id, date) {
  const t = task(id);
  const allSkipped = slotsOf(t).every((_, i) => hv(date, id + '.' + i) === 's');
  slotsOf(t).forEach((_, i) => {
    const key = id + '.' + i, v = hv(date, key);
    if (allSkipped) setHv(date, key, null);
    else if (!isDone(v)) setHv(date, key, 's');
  });
  render();
  toast(allSkipped ? 'Atlama geri alındı.' : `${relDay(date)} için atlandı. Serin bozulmaz.`);
}

// ---------- feedback: sound, vibration, confetti ----------
let actx = null;
function feedback() {
  const st = S.data.settings;
  if (st.vibrate) try { navigator.vibrate && navigator.vibrate(18); } catch {}
  if (st.sound) try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    [[880, 0], [1320, .07]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.12, t0 + d + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .16);
      o.connect(g).connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + .18);
    });
  } catch {}
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.hidden = false; const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--accent').trim() || '#2F55E4', '#E0565B', '#2E9E77', '#E08A23', '#9157DA'];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 22 * devicePixelRatio, vy: (-Math.random() * 18 - 6) * devicePixelRatio, w: (6 + Math.random() * 6) * devicePixelRatio, h: (8 + Math.random() * 10) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .55 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore(); });
    if (t - t0 < 2200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

// ---------- toast ----------
function toast(msg, action) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="grow"></span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  el.firstChild.textContent = msg;
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.remove(); };
  box.appendChild(el);

  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, action ? 5200 : 3200);

async function enter(acc, fresh = false) {
  S.unsub.forEach(u => { try { u(); } catch {} }); S.unsub = [];
  S.me = acc;
  let app = await Store.get('app_' + acc.id);
  if (!app) { app = defaultApp(); await Store.raw('app_' + acc.id, { kind: 'app', acct: acc.id, ...app }); }
  S.data = sanitizeApp(app);
  S.hist = {};
  await new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    S.unsub.push(Store.watchHist(acc.id, docs => {
      let changed = false;
      for (const [name, doc] of Object.entries(docs)) {
        if (!doc || !doc.month) continue;
        const prev = S.hist[doc.month];
        if (!prev || JSON.stringify(prev.d) !== JSON.stringify(doc.d)) { S.hist[doc.month] = { d: doc.d || {} }; changed = true; }
      }
      if (done && changed && S.me) render();
      fin();
    }));
    setTimeout(fin, 4000);
  });
  S.unsub.push(Store.watch('app_' + acc.id, doc => {
    if (!doc || S.appTimer) return;
    const next = sanitizeApp(doc);
    if (JSON.stringify(next) === JSON.stringify(S.data)) return;
    S.data = next; applyTheme(); render();
  }));
  S.view = 'today'; S.sel = today(); S.calMonth = today().slice(0, 7); S.calSel = today();
  applyTheme();
  renderShell();
  render();
}
function sanitizeApp(app) {
  const d = defaultApp();
  const out = {
    tasks: Array.isArray(app.tasks) ? app.tasks.map(normTask) : [],
    cats: Array.isArray(app.cats) && app.cats.length ? app.cats : d.cats,
    settings: { ...d.settings, ...(app.settings || {}) },
  };
  return out;
}

// ---------- shared item row ----------
function itemRow(it, opts = {}) {

  const td = today();
  let now = false, late = false;

    const [h, m] = it.time.split(':').map(Number), n = new Date(), mins = n.getHours() * 60 + n.getMinutes();
    now = Math.abs(mins - (h * 60 + m)) <= 45;
    late = !now && mins > h * 60 + m;
  }
  const missed = !done && !skip && !it.overdue && it.date < td;
  const streak = opts.noStreak ? 0 : taskStreak(t);
  const meta = [];
  if (t.priority) meta.push(`<span class="m-star">${ic('star')}Önemli</span>`);
  if (it.overdue) meta.push(`<span class="time">Gecikti: ${relDay(t.rec.date)}</span>`);
  else if (it.time) meta.push(`<span class="time">${it.time}</span>`);
  if (now) meta.push(`<span style="color:var(--accent);font-weight:800">Şimdi zamanı</span>`);
  if (late) meta.push(`<span class="m-late">Saati geçti, yapılmadı</span>`);
  if (missed) meta.push(`<span class="m-late">Yapılmadı</span>`);
  if (t.times.length > 1 && !it.overdue) meta.push(`<span>${it.i + 1}. kez</span>`);
  if (done && it.v && it.v !== '1') meta.push(`<span class="m-done">Saat ${esc(it.v)}</span>`);
  if (streak > 1) meta.push(`<span class="m-flame">${ic('flame')}${streak} gün</span>`);
  if (t.stock.on) meta.push(`<span class="${t.stock.qty <= t.stock.low ? 'm-low' : ''}">${ic('box')}${t.stock.qty} adet</span>`);
  if (skip) meta.push(`<span>Atlandı</span>`);
  const data = `data-id="${t.id}" data-i="${it.i}" data-date="${it.date}"`;
  return `<div class="item ${done ? 'is-done' : ''} ${skip ? 'is-skip' : ''} ${now ? 'is-now' : ''} ${late || missed ? 'is-late' : ''} ${it.overdue ? 'overdue' : ''} ${t.priority ? 'is-star' : ''}" data-act="detail" data-key="${esc(it.key)}" ${data}>
    <button class="check" style="--c:${c.color}" data-act="toggle" ${data} aria-label="${esc(t.title)}: ${done ? 'yapılmadı olarak geri al' : 'yapıldı olarak işaretle'}" aria-pressed="${done}">${ic('check')}</button>
    <div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${meta.join('')}</div></div>
    <button class="do-btn ${done ? 'on' : ''}" data-act="toggle" ${data} aria-label="${esc(t.title)}: ${done ? 'yapılmadı olarak geri al' : 'yapıldı olarak işaretle'}">${done ? `${ic('check')}Yapıldı` : 'Yaptım'}</button>
  </div>`;
}

// ---------- TODAY ----------
function viewToday() {
  const td = today(), sel = S.sel;
  const mon = mondayOf(sel);
  const strip = WEEK.map((_, k) => {
    const s = addDays(mon, k), st = dayStats(s), d = parse(s);
    const h = s <= td && st.exp ? Math.round(st.ratio * 100) : 0;
    return `<button class="wd ${s === td ? 'today' : ''} ${st.exp && st.done === st.exp && s <= td ? 'full' : ''}" style="--h:${h}%" data-act="sel-day" data-v="${s}" aria-pressed="${s === sel}" aria-label="${DAYS[d.getDay()]} ${fmtDate(s)}, ${st.done}/${st.exp}">
      <span class="lvl"></span><span class="d">${DAY3[d.getDay()]}</span><span class="n">${d.getDate()}</span><span class="pip ${st.exp ? '' : 'off'}"></span></button>`;
  }).join('');
  const items = dayItems(sel);
  const st = dayStats(sel);
  const pct = st.exp ? Math.round(st.ratio * 100) : 0;
  const C = 2 * Math.PI * 42;
  const ps = perfectStreak();
  const isToday = sel === td;
  const low = S.data.tasks.filter(t => t.stock.on && !t.archived && !t.paused && t.stock.qty <= t.stock.low);
  const remain = st.exp - st.done;
  const heroTitle = !st.exp ? (isToday ? 'Bugün boş bir gün' : 'Bu güne planlı görev yok')
    : remain === 0 ? (isToday ? 'Bugün tamamlandı' : 'Bu gün tamamlanmış')
      : isToday ? `${remain} görev kaldı` : sel < td ? `${remain} görev yapılmamış` : `${st.exp} görev planlı`;
  const nextIt = isToday ? items.find(i => !i.overdue && !isDone(i.v) && i.v !== 's' && i.time && i.time >= nowHM()) : null;
  const heroSub = !st.exp ? 'Aşağıdaki Ekle düğmesiyle görev ekleyebilirsin.'
    : nextIt ? `Sıradaki: ${nextIt.t.title} · ${nextIt.time}` : `${st.done} / ${st.exp} tamamlandı`;

  let body;
  if (!S.data.tasks.length) {
    body = `<div class="card empty">
      <span class="cat-ic lg" style="--c:var(--accent)">${ic('repeat')}</span>
      <h3>İlk ritmini oluştur</h3>
      <p>Bir kez ekle, her gün, hafta ya da ay kendiliğinden gelsin. Bir şablonla başla:</p>
      <div class="tpl-grid">${TEMPLATES.map((tp, k) => `<button class="tpl" data-act="tpl" data-v="${k}">${ic(tp.icon)}${esc(tp.label)}</button>`).join('')}</div>
      <button class="btn btn-ghost btn-sm" data-act="sample">Örnek görevlerle dene</button>
    </div>`;
  } else if (!items.length) {
    body = `<div class="card empty"><span class="cat-ic lg" style="--c:var(--ok)">${ic('sun')}</span><h3>${isToday ? 'Bugün için görev yok' : fmtDate(sel) + ' boş'}</h3><p>${isToday ? 'Keyfini çıkar. Yarın neler var görmek için üstteki günlere dokun.' : 'Bu tarihe denk gelen tekrarlayan görev bulunmuyor.'}</p></div>`;
  } else {
    const hide = S.data.settings.hideDone;
    const groups = [['overdue', 'Gecikmiş', 'alert'], ['sabah', 'Sabah', 'sun'], ['ogle', 'Öğle', 'sun'], ['aksam', 'Akşam', 'moon'], ['gece', 'Gece', 'moon'], ['gun', 'Gün içinde', 'clock']];
    const gOf = it => { if (it.overdue) return 'overdue'; if (!it.time) return 'gun'; const h = +it.time.slice(0, 2); return h < 5 ? 'gece' : h < 12 ? 'sabah' : h < 17 ? 'ogle' : h < 21 ? 'aksam' : 'gece'; };
    let doneHidden = 0;
    body = groups.map(([g, label, gic]) => {
      let its = items.filter(it => gOf(it) === g);
      if (!its.length) return '';
      const dn = its.filter(it => isDone(it.v)).length;
      if (hide) { doneHidden += dn; its = its.filter(it => !isDone(it.v)); }
      if (!its.length) return '';
      return `<section class="sec"><div class="sec-h"><h3>${ic(gic)}${label}</h3><span class="tnum">${dn}/${its.length + (hide ? dn : 0)}</span></div><div class="list">${its.map(it => itemRow(it)).join('')}</div></section>`;
    }).join('');
    body += `<button class="done-toggle" data-act="toggle-hide">${ic(hide ? 'eye' : 'check')}${hide ? (doneHidden ? `Tamamlanan ${doneHidden} görevi göster` : 'Tamamlananları göster') : 'Tamamlananları gizle'}</button>`;
  }

  return `<div class="stack">
    <div class="week">
      <button class="week-nav" data-act="week" data-v="-7" aria-label="Önceki hafta">${ic('left')}</button>
      <div class="week-days">${strip}</div>
      <button class="week-nav" data-act="week" data-v="7" aria-label="Sonraki hafta">${ic('right')}</button>
    </div>
    ${!isToday ? `<div class="row between"><span class="eyebrow">${DAYS[parse(sel).getDay()]}, ${fmtDate(sel)}</span><button class="link" data-act="sel-day" data-v="${td}">Bugüne dön</button></div>` : ''}
    <div class="card hero">
      <div class="ring" role="img" aria-label="%${pct} tamamlandı"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="42"/><circle class="fgc" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (st.exp ? st.ratio : 0))}"/></svg><div class="val tnum">${pct}<small>%</small></div></div>
      <div style="min-width:0"><h2>${esc(heroTitle)}</h2><p>${esc(heroSub)}</p>
        <div class="badges">${ps > 0 ? `<span class="badge flame">${ic('flame')}${ps} gündür hepsi tamam</span>` : ''}${st.exp ? `<span class="badge tnum">${st.done} / ${st.exp} yapıldı</span>` : ''}</div>
      </div>
    </div>
    ${low.length && isToday ? `<div class="alert" role="button" tabindex="0" data-act="detail" data-id="${low[0].id}">${ic('alert')}<div><b>Stok azalıyor:</b> ${low.map(t => `${esc(t.title)} (${t.stock.qty})`).join(', ')}</div></div>` : ''}
    ${body}
  </div>`;
}

// ---------- CALENDAR ----------
function viewCalendar() {
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = `${y}-${pad(m)}-01`;
  const start = mondayOf(first);
  const td = today();
  let cells = '';
  for (let k = 0; k < 42; k++) {
    const s = addDays(start, k), d = parse(s);
    if (k >= 35 && d.getMonth() !== m - 1) break;
    const st = dayStats(s), out = d.getMonth() !== m - 1;
    const past = s <= td;
    const h = past && st.exp ? Math.round(st.ratio * 100) : 0;
    const dots = !past && st.exp ? `<span class="cnt">${'<i></i>'.repeat(Math.min(3, st.exp))}</span>` : '';
    cells += `<button class="cd ${out ? 'out' : ''} ${s === td ? 'today' : ''} ${past && st.exp && st.done === st.exp ? 'full' : ''}" style="--h:${h}%" data-act="cal-day" data-v="${s}" aria-pressed="${s === S.calSel}" aria-label="${fmtDate(s)}: ${st.done}/${st.exp}"><span class="f"></span>${d.getDate()}${dots}</button>`;
  }
  const sel = S.calSel, items = dayItems(sel, false), st = dayStats(sel);
  const upcoming = [];
  for (let k = 1; k <= 7; k++) {
    const s = addDays(td, k), n = dayItems(s, false).length;
    if (n) upcoming.push(`<div><span>${relDay(s)}${relDay(s) !== fmtShort(s) ? ` <span style="color:var(--faint)">· ${fmtShort(s)}</span>` : ''}</span><span>${n} görev</span></div>`);
  }
  return `<div class="stack">
    <div class="card cal">
      <div class="cal-h">
        <button class="icon-btn" data-act="cal-month" data-v="-1" aria-label="Önceki ay">${ic('left')}</button>
        <h2>${MONTHS[m - 1]} <span style="color:var(--muted);font-weight:600">${y}</span></h2>
        <button class="icon-btn" data-act="cal-month" data-v="1" aria-label="Sonraki ay">${ic('right')}</button>
      </div>
      <div class="cal-grid">${WEEK.map(d => `<div class="cal-dow">${DAY3[d]}</div>`).join('')}${cells}</div>
      <div class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 38%,transparent)"></i>Hepsi tamam</span><span><i style="background:linear-gradient(to top,color-mix(in srgb,var(--accent) 22%,transparent) 50%,var(--surface-2) 50%)"></i>Kısmen</span><span><i style="box-shadow:inset 0 0 0 2px var(--accent)"></i>Bugün</span></div>
    </div>
    <section class="sec">
      <div class="sec-h"><h3>${relDay(sel)}${relDay(sel) !== fmtShort(sel) ? ' · ' + fmtShort(sel) : ''}</h3><span class="tnum">${st.done}/${st.exp}</span></div>
      ${items.length ? `<div class="list">${items.map(it => itemRow(it)).join('')}</div>` : `<div class="card empty" style="padding:20px"><p>Bu güne denk gelen görev yok.</p></div>`}
    </section>
    ${upcoming.length ? `<section class="sec"><div class="sec-h"><h3>Önümüzdeki 7 gün</h3></div><div class="card panel next-list">${upcoming.join('')}</div></section>` : ''}
  </div>`;
}

// ---------- TASKS ----------
function viewTasks() {
  return `<div class="stack" style="gap:14px">
    <div class="search">${ic('search')}<input class="inp" id="t-search" type="search" placeholder="Görevlerde ara" value="${esc(S.q)}" aria-label="Görevlerde ara"></div>
    <div id="t-list" class="stack" style="gap:14px">${taskListHTML()}</div>
  </div>`;
}
function taskListHTML() {
  const all = S.data.tasks;
  const counts = {
    active: all.filter(t => !t.archived && !t.paused && !(t.rec.type === 'once' && t.doneOn)).length,
    paused: all.filter(t => t.paused && !t.archived).length,
    done: all.filter(t => t.rec.type === 'once' && t.doneOn && !t.archived).length,
    archived: all.filter(t => t.archived).length,
    star: all.filter(t => t.priority && !t.archived).length,
  };
  const chips = [['active', 'Aktif'], ['star', '★ Önemli'], ...S.data.cats.map(c => ['cat:' + c.id, c.name, c.color]), ['paused', 'Duraklatılan'], ['done', 'Tamamlanan'], ['archived', 'Arşiv']];
  let list = all.filter(t => {
    const f = S.filter;
    if (f === 'active') return !t.archived && !t.paused && !(t.rec.type === 'once' && t.doneOn);
    if (f === 'star') return t.priority && !t.archived;
    if (f === 'paused') return t.paused && !t.archived;
    if (f === 'done') return t.rec.type === 'once' && t.doneOn && !t.archived;
    if (f === 'archived') return t.archived;
    if (f.startsWith('cat:')) return t.cat === f.slice(4) && !t.archived;
    return true;
  });
  const q = S.q.trim().toLocaleLowerCase('tr');
  if (q) list = list.filter(t => (t.title + ' ' + t.note).toLocaleLowerCase('tr').includes(q));
  const td = today();
  const NX = new Map(list.map(t => [t.id, nextOcc(t)]));
  list.sort((a, b) => (NX.get(a.id) || '9999').localeCompare(NX.get(b.id) || '9999') || (a.times[0] || '99').localeCompare(b.times[0] || '99'));
  const rows = list.map(t => {
    const c = cat(t.cat), nx = NX.get(t.id), streak = taskStreak(t);
    const meta = [`<span>${ic('repeat')}${esc(recLabel(t))}</span>`];
    if (t.times.length) meta.push(`<span class="time">${t.times.slice(0, 3).join(' · ')}${t.times.length > 3 ? ' …' : ''}</span>`);
    if (t.archived) meta.push(`<span class="paused-tag">Arşivde</span>`);
    else if (t.paused) meta.push(`<span class="paused-tag">Duraklatıldı</span>`);
    else if (t.rec.type === 'once' && t.doneOn) meta.push(`<span>${ic('check')}${fmtShort(t.doneOn)}</span>`);
    else if (nx) meta.push(`<span class="next">Sonraki: ${relDay(nx)}</span>`);
    else meta.push(`<span>Bitti</span>`);
    if (streak > 1) meta.push(`<span class="m-flame">${ic('flame')}${streak}</span>`);
    if (t.stock.on) meta.push(`<span class="${t.stock.qty <= t.stock.low ? 'm-low' : ''}">${ic('box')}${t.stock.qty} adet</span>`);
    return `<div class="item tcard" data-act="detail" data-id="${t.id}" data-date="${td}">
      <span class="cat-ic" style="--c:${c.color}">${ic(c.icon)}</span>
      <div class="item-main"><div class="item-title">${esc(t.title)}${t.priority ? `<span class="m-star" style="font-size:.85rem;display:inline-flex;gap:.2rem;align-items:center">${ic('star')}Önemli</span>` : ''}</div><div class="item-meta">${meta.join('')}</div></div>
      ${ic('right')}
    </div>`;
  }).join('');
  return `
    <div class="chips" role="group" aria-label="Filtre">${chips.map(([k, l, col]) => {
      const n = k.startsWith('cat:') ? all.filter(t => t.cat === k.slice(4) && !t.archived).length : counts[k];
      return `<button class="chip ${col ? 'chip-c' : ''}" ${col ? `style="--c:${col}"` : ''} data-act="filter" data-v="${k}" aria-pressed="${S.filter === k}">${col ? '<i></i>' : ''}${esc(l)} <span class="ct">${n}</span></button>`;
    }).join('')}</div>
    ${rows ? `<div class="list">${rows}</div>` : `<div class="card empty"><span class="cat-ic lg" style="--c:var(--accent)">${ic(q ? 'search' : 'list')}</span><h3>${q ? 'Sonuç bulunamadı' : 'Burada görev yok'}</h3><p>${q ? `“${esc(S.q)}” ile eşleşen görev yok.` : 'Yeni görev eklemek için alttaki artı düğmesine dokun.'}</p>${!q ? `<button class="btn btn-primary btn-sm" data-act="add">${ic('plus')}Görev ekle</button>` : ''}</div>`}`;
}

// ---------- STATS ----------
function viewStats() {
  const td = today();
  if (!S.data.tasks.length) return `<div class="card empty"><span class="cat-ic lg" style="--c:var(--accent)">${ic('chart')}</span><h3>Henüz veri yok</h3><p>Görev ekleyip tamamladıkça seri, oran ve ısı haritası burada belirir.</p><button class="btn btn-primary btn-sm" data-act="add">${ic('plus')}İlk görevini ekle</button></div>`;
  const hm = nowHM();
  const range = n => { let e = 0, d = 0; for (let k = 0; k < n; k++) { const s = addDays(td, -k); if (k === 0) { dayItems(s, false).forEach(x => { if (isDone(x.v)) { e++; d++; } else if (x.v !== 's' && x.time && x.time < hm) e++; }); continue; } const st = dayStats(s); e += st.exp; d += st.done; } return e ? Math.round(d / e * 100) : null; };
  const tStat = dayStats(td);
  const r7 = range(7), r30 = range(30);
  const ps = perfectStreak();
  let totalDone = 0; Object.values(S.hist).forEach(m => Object.values(m.d).forEach(day => Object.values(day).forEach(v => { if (isDone(v)) totalDone++; })));
  // 14 day bars
  const days14 = Array.from({ length: 14 }, (_, k) => addDays(td, k - 13));
  const bars = days14.map(s => { const st = dayStats(s); const p = st.exp ? Math.round(st.ratio * 100) : 0; return `<div class="bar ${st.exp ? '' : 'none'} ${s === td ? 'today' : ''}" title="${fmtDate(s)}: ${st.exp ? `%${p} (${st.done}/${st.exp})` : 'görev yok'}"><i style="height:${st.exp ? Math.max(3, p) : 3}%"></i></div>`; }).join('');
  const barX = days14.map((s, k) => `<span>${k % 2 === 1 || s === td ? (s === td ? 'Bgn' : parse(s).getDate()) : ''}</span>`).join('');
  // heatmap 18 weeks
  const weeks = 18, hStart = addDays(mondayOf(td), -7 * (weeks - 1));
  let heat = '';
  for (let k = 0; k < weeks * 7; k++) {
    const s = addDays(hStart, k);
    if (s > td) { heat += `<i class="fut"></i>`; continue; }
    const st = dayStats(s);
    const l = !st.exp ? 0 : st.ratio === 0 ? 0 : st.ratio < .34 ? 1 : st.ratio < .67 ? 2 : st.ratio < 1 ? 3 : 4;
    heat += `<i class="l${l}" title="${fmtDate(s)}: ${st.exp ? `${st.done}/${st.exp}` : 'görev yok'}"></i>`;
  }
  // per-task
  const rates = S.data.tasks.filter(t => !t.archived && t.rec.type !== 'once').map(t => ({ t, r: taskRate(t), s: taskStreak(t) })).filter(x => x.r !== null).sort((a, b) => b.r - a.r);
  // weekday performance (last 8 weeks)
  const wd = WEEK.map(() => ({ e: 0, d: 0 }));
  for (let k = 1; k <= 56; k++) { const s = addDays(td, -k), st = dayStats(s), i = WEEK.indexOf(parse(s).getDay()); wd[i].e += st.exp; wd[i].d += st.done; }
  const wdp = wd.map(x => x.e ? Math.round(x.d / x.e * 100) : null);
  const valid = wdp.map((p, i) => [p, i]).filter(x => x[0] !== null);
  const best = valid.length ? valid.reduce((a, b) => b[0] > a[0] ? b : a) : null;
  const worst = valid.length ? valid.reduce((a, b) => b[0] < a[0] ? b : a) : null;
  // categories (30 days done)
  const catCount = {};
  for (let k = 0; k < 30; k++) { const s = addDays(td, -k); dayItems(s, false).forEach(it => { if (isDone(it.v)) catCount[it.t.cat] = (catCount[it.t.cat] || 0) + 1; }); }
  const catRows = Object.entries(catCount).sort((a, b) => b[1] - a[1]);
  const catMax = catRows.length ? catRows[0][1] : 1;

  return `<div class="stack">
    <div class="tiles">
      <div class="card tile"><span class="k">Bugün</span><span class="v tnum">${tStat.exp ? Math.round(tStat.ratio * 100) : 0}<small>%</small></span><span class="k" style="font-weight:600">${tStat.done}/${tStat.exp} görev</span></div>
      <div class="card tile"><span class="k">Kusursuz seri</span><span class="v tnum" style="color:var(--flame)">${ps}<small> gün</small></span><span class="k" style="font-weight:600">her şey tamam</span></div>
      <div class="card tile"><span class="k">Son 7 gün</span><span class="v tnum">${r7 ?? '–'}<small>${r7 != null ? '%' : ''}</small></span><span class="k" style="font-weight:600">tamamlama oranı</span></div>
      <div class="card tile"><span class="k">Son 30 gün</span><span class="v tnum">${r30 ?? '–'}<small>${r30 != null ? '%' : ''}</small></span><span class="k" style="font-weight:600">toplam ${totalDone} işaret</span></div>
    </div>
    <div class="card panel">
      <div class="panel-h"><h3>Son 14 gün</h3><span>günlük tamamlama %</span></div>
      <div class="bars"><div class="grid-l" style="top:0">100</div><div class="grid-l" style="top:50%">50</div>${bars}</div>
      <div class="bar-x">${barX}</div>
    </div>
    <div class="card panel">
      <div class="panel-h"><h3>Ritim haritası</h3><span>son ${weeks} hafta</span></div>
      <div class="heat-wrap"><div class="heat-dow">${WEEK.map((d, i) => `<span>${i % 2 === 0 ? DAY3[d] : ''}</span>`).join('')}</div><div class="heat" style="grid-template-columns:repeat(${weeks},1fr)">${heat}</div></div>
      <div class="legend" style="margin-top:0"><span>Az</span><span><i class="" style="background:var(--surface-2)"></i><i style="background:color-mix(in srgb,var(--accent) 28%,var(--surface-2))"></i><i style="background:color-mix(in srgb,var(--accent) 52%,var(--surface-2))"></i><i style="background:color-mix(in srgb,var(--accent) 76%,var(--surface-2))"></i><i style="background:var(--accent)"></i></span><span>Tam</span></div>
    </div>
    ${valid.length ? `<div class="card panel">
      <div class="panel-h"><h3>Haftanın günleri</h3><span>son 8 hafta</span></div>
      <div class="dow-bars">${wdp.map((p, i) => `<div class="bar ${p === null ? 'none' : ''}" title="${DAYS[WEEK[i]]}: ${p === null ? 'görev yok' : '%' + p}"><i style="height:${p === null ? 3 : Math.max(3, p * .75)}%;max-width:28px;${best && i === best[1] ? '' : 'opacity:.55'}"></i><span>${DAY3[WEEK[i]]}</span></div>`).join('')}</div>
      ${best && worst && best[1] !== worst[1] ? `<p class="insight" style="margin:0">En düzenli günün <b>${DAYS[WEEK[best[1]]]}</b> (%${best[0]}). En çok aksayan gün <b>${DAYS[WEEK[worst[1]]]}</b> (%${worst[0]}).</p>` : ''}
    </div>` : ''}
    ${rates.length ? `<div class="card panel">
      <div class="panel-h"><h3>Görev bazında</h3><span>30 günlük oran</span></div>
      <div class="rates">${rates.map(x => { const c = cat(x.t.cat); return `<div class="rate" data-act="detail" data-id="${x.t.id}" data-date="${td}" style="cursor:pointer"><span class="cat-ic" style="--c:${c.color}">${ic(c.icon)}</span><div style="min-width:0"><div class="rate-name">${esc(x.t.title)}</div><div class="rate-bar" style="--c:${c.color}"><i style="width:${Math.round(x.r * 100)}%"></i></div></div><div class="rate-v tnum">%${Math.round(x.r * 100)}${x.s > 1 ? `<div class="m-flame" style="font-size:0.73rem;display:flex;gap:2px;justify-content:flex-end;align-items:center">${ic('flame')}${x.s}</div>` : ''}</div></div>`; }).join('')}</div>
    </div>` : ''}
    ${catRows.length ? `<div class="card panel">
      <div class="panel-h"><h3>Kategoriler</h3><span>30 günde tamamlanan</span></div>

let layerStack = [];
function openLayer(html, kind = 'sheet', onClose, isStatic = false) {
  const root = $('#layer');
  $('#toasts').innerHTML = '';
  const over = document.createElement('div');
  over.className = 'overlay' + (kind === 'modal' ? ' modal-over' : '');
  const box = document.createElement('div');
  box.className = kind;
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  box.innerHTML = html;
  root.append(over, box);
  const entry = { over, box, kind, onClose, isStatic };
  layerStack.push(entry);
  over.addEventListener('click', () => { if (!entry.isStatic) closeLayer(entry); });
  requestAnimationFrame(() => { over.classList.add('in'); box.classList.add('in'); });
  setTimeout(() => { const f = box.querySelector('[autofocus]'); if (f && matchMedia('(pointer:fine)').matches) f.focus(); }, 320);
  return entry;
}
function closeLayer(entry = layerStack[layerStack.length - 1]) {
  if (!entry) return;
  layerStack = layerStack.filter(e => e !== entry);
  entry.over.classList.remove('in'); entry.box.classList.remove('in');
  setTimeout(() => { entry.over.remove(); entry.box.remove(); }, 320);
  if (entry.onClose) entry.onClose();
}
function closeAll() { [...layerStack].reverse().forEach(e => closeLayer(e)); }
function confirmBox({ title, text, ok = 'Onayla', danger = false, onOk }) {
  const e = openLayer(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn btn-ghost" data-m="cancel">Vazgeç</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-m="ok">${esc(ok)}</button></div>`, 'modal');
  e.box.querySelector('[data-m=cancel]').onclick = () => closeLayer(e);
  e.box.querySelector('[data-m=ok]').onclick = () => { closeLayer(e); onOk(); };
}
function showCodeModal(code, fresh) {
  const e = openLayer(`<span class="cat-ic lg" style="--c:var(--accent)">${ic('key')}</span>
    <h2>${fresh ? 'Hoş geldin! Kurtarma kodunu sakla' : 'Yeni kurtarma kodun'}</h2>

    <div class="code-box" id="code-box">${esc(code)}</div>
    <div class="row" style="gap:8px"><button class="btn btn-ghost" data-m="copy" style="flex:1">${ic('copy')}Kopyala</button><button class="btn btn-primary" data-m="ok" style="flex:1">Not ettim</button></div>`, 'modal', null, true);

function copyText(text, el) {

let detailEntry = null, detailCtx = null;
function openDetail(id, date, slot) {

  const streak = taskStreak(t), best = bestStreak(t), rate = taskRate(t);

async function exportData() {
  const payload = JSON.stringify({ app: 'ritim', v: 1, exported: new Date().toISOString(), user: S.me.username, data: S.data, hist: S.hist }, null, 1);
  const fn = `ritim-yedek-${S.me.username}-${today()}.json`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch {}
  if (dl) {
    try { await dl.save({ filename: fn, data: payload }); toast('Yedek kaydedildi.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (!window.claude) { toast('Yedek indirildi.'); return; }
  } catch {}
  const e = openLayer(`<h2>Yedek</h2><p>İndirme başlamadıysa aşağıdaki metni kopyalayıp bir dosyaya kaydedebilirsin.</p><textarea class="inp" id="exp-txt" readonly style="min-height:160px;font:12px var(--f-mono)">${esc(payload)}</textarea><div class="row" style="gap:8px"><button class="btn btn-ghost" data-m="copy" style="flex:1">${ic('copy')}Kopyala</button><button class="btn btn-primary" data-m="ok" style="flex:1">Tamam</button></div>`, 'modal');
  e.box.querySelector('[data-m=ok]').onclick = () => closeLayer(e);
  e.box.querySelector('[data-m=copy]').onclick = () => { const ta = $('#exp-txt', e.box); ta.select(); copyText(payload, null); };
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let j;
    try { j = JSON.parse(fr.result); if (j.app !== 'ritim' || !j.data || !Array.isArray(j.data.tasks)) throw 0; }
    catch { toast('Bu dosya bir Ritim yedeği değil.'); return; }
    confirmBox({
      title: 'Yedek geri yüklensin mi?', text: `${j.data.tasks.length} görev ve geçmişi yüklenecek. Şu anki görevlerin bu yedekle değiştirilir.`, ok: 'Geri yükle',
      onOk: () => {
        S.data = sanitizeApp(j.data); saveApp();
        const old = Object.keys(S.hist);
        S.hist = {};
        Object.entries(j.hist || {}).forEach(([mk, m]) => { if (/^\d{4}-\d{2}$/.test(mk) && m && m.d) { S.hist[mk] = { d: m.d }; Store.write(hName(mk), { kind: 'hist', acct: S.me.id, month: mk, d: m.d }); } });
        old.filter(mk => !S.hist[mk]).forEach(mk => Store.write(hName(mk), { kind: 'hist', acct: S.me.id, month: mk, d: {} }));
        applyTheme(); closeAll(); render(); toast('Yedek geri yüklendi.');
      },
    });
  };
  fr.readAsText(file);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    // auth
    case 'auth-tab': auth.tab = v; auth.err = ''; renderAuth(); break;
    case 'pw-eye': { const inp = b.parentElement.querySelector('input'); inp.type = inp.type === 'password' ? 'text' : 'password'; break; }
    case 'pick-user': $('#a-user').value = v; $('#a-pw').focus(); break;
    // nav
    case 'nav': S.view = v; render(); $('#view').scrollTop = 0; break;
    case 'add': openEditor(); break;
    case 'settings': openSettings(); break;
    case 'close': closeLayer(); break;
    case 'sel-day': S.sel = v; render(); break;
    case 'week': S.sel = addDays(S.sel, +v); render(); break;
    case 'toggle-hide': S.data.settings.hideDone = !S.data.settings.hideDone; saveApp(); render(); break;
    case 'tpl': openEditor(null, TEMPLATES[+v].t); break;
    case 'sample': {
      [0, 1, 2, 3, 5].forEach(k => S.data.tasks.push(normTask(TEMPLATES[k].t)));
      saveApp(); render(); toast('Örnek görevler eklendi. İstediğin gibi düzenleyebilirsin.');
      break;
    }
    case 'cal-month': { const [y, m] = S.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + (+v), 1); S.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); break; }
    case 'cal-day': S.calSel = v; if (v.slice(0, 7) !== S.calMonth) S.calMonth = v.slice(0, 7); render(); break;
    case 'filter': S.filter = v; render(); break;
    // items
    case 'toggle': ev.stopPropagation(); toggleSlot(b.dataset.id, +b.dataset.i, b.dataset.date); if (detailEntry) renderDetail(); break;
    case 'detail': if (detailEntry && b.closest('#dt-body')) return; openDetail(b.dataset.id, b.dataset.date, b.dataset.i); break;
    // detail actions
    case 'skip': skipDay(detailCtx.id, detailCtx.date); renderDetail(); break;
    case 'edit': { const id = detailCtx.id; closeLayer(detailEntry); openEditor(id); break; }
    case 'pause': { const t = task(detailCtx.id); t.paused = !t.paused; saveApp(); render(); renderDetail(); toast(t.paused ? 'Duraklatıldı. Listede görünmeyecek.' : 'Görev yeniden aktif.'); break; }
    case 'archive': { const t = task(detailCtx.id); t.archived = !t.archived; saveApp(); render(); if (t.archived) { closeLayer(detailEntry); toast('Arşive taşındı.', { label: 'Geri al', fn: () => { t.archived = false; saveApp(); render(); } }); } else renderDetail(); break; }
    case 'star': { const t = task(detailCtx.id); t.priority = t.priority ? 0 : 1; saveApp(); render(); renderDetail(); toast(t.priority ? 'Önemli olarak işaretlendi.' : 'Önemli işareti kaldırıldı.'); break; }
    case 'delete': deleteTask(detailCtx.id); break;
    case 'stock-add': { const t = task(detailCtx.id); t.stock.qty += +v; saveApp(); render(); renderDetail(); toast(`Stok ${t.stock.qty} adet oldu.`); break; }
    case 'stock-set': { const inp = $('#stock-custom'); const n = Number(inp.value); if (inp.value === '' || isNaN(n) || n < 0) { inp.focus(); return; } const t = task(detailCtx.id); t.stock.qty = n; saveApp(); render(); renderDetail(); toast('Stok güncellendi.'); break; }
    // editor
    case 'ed-tpl': { const id = D.id; const p = TEMPLATES[+v].t; Object.assign(D, normTask(p)); D.id = id; D._new = true; renderEditorBody(); break; }
    case 'ed-type': {
      D.rec.type = v;
      if (v === 'weekly' && !D.rec.days.length) D.rec.days = [parse(D.start).getDay()];
      if (v === 'once' && !D.rec.date) D.rec.date = today();
      D.rec.every = 1; renderEditorBody(); break;
    }
    case 'ed-prio': D.priority = +v; renderEditorBody(); break;
    case 'ed-more': D._more = !D._more; renderEditorBody(); break;
    case 'ed-every': D.rec.every = Math.min(52, Math.max(1, (D.rec.every || 1) + (+v))); renderEditorBody(); break;
    case 'ed-day': { const d = +v, ds = D.rec.days; D.rec.days = ds.includes(d) ? ds.filter(x => x !== d) : [...ds, d]; renderEditorBody(); break; }
    case 'ed-days': D.rec.days = v.split(',').map(Number); renderEditorBody(); break;
    case 'ed-cat': D.cat = v; renderEditorBody(); break;
    case 'ed-time-add': {
      let tm = v;
      if (!tm) { const last = [...D.times].filter(Boolean).sort().pop(); if (last) { const h = Math.min(23, +last.slice(0, 2) + 4); tm = `${pad(h)}:${last.slice(3)}`; } else tm = '09:00'; }
      if (!D.times.includes(tm)) D.times.push(tm);
      D.times.sort(); renderEditorBody(); break;
    }
    case 'ed-time-del': D.times.splice(+v, 1); renderEditorBody(); break;
    case 'ed-dur': D.end = +v ? addDays(D.start, +v - 1) : null; renderEditorBody(); break;

    case 'export': exportData(); break;
    case 'import': $('#import-file').click(); break;
    case 'logout': logout(); break;
    case 'edit-name': {
      const e = openLayer(`<h2>Adını değiştir</h2><input class="inp" id="m-name" value="${esc(S.me.name)}" maxlength="40"><div class="err" id="m-err"></div><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn btn-ghost" data-m="cancel">Vazgeç</button><button class="btn btn-primary" data-m="ok">Kaydet</button></div>`, 'modal');

      };

    }
    case 'pw-change':
      verifyPwModal('Şifreyi değiştir', `<div class="field"><label for="m-pw1">Yeni şifre</label><input class="inp" type="password" id="m-pw1" autocomplete="new-password"></div><div class="field"><label for="m-pw2">Yeni şifre tekrar</label><input class="inp" type="password" id="m-pw2" autocomplete="new-password"></div>`, async (acc, e) => {

        closeLayer(e); toast('Şifren değiştirildi.');
      });

        closeLayer(e); showCodeModal(code, false);

      break;
    case 'del-acc':
      verifyPwModal('Hesabı sil', '<p>Tüm görevlerin, geçmişin ve hesabın kalıcı olarak silinir. Bu işlem geri alınamaz.</p>', async (acc, e) => {
        closeLayer(e);
        const aid = acc.id;
        await Store.del('app_' + aid).catch(() => {});
        for (const mk of Object.keys(S.hist)) await Store.del(hName(mk)).catch(() => {});
        S.accounts = S.accounts.filter(x => x.id !== aid); await saveAccounts();
        try { const l = lastUsers().filter(u => u !== acc.username); localStorage.setItem(LP + 'recent:' + S.scope, JSON.stringify(l)); } catch {}
        await logout(); toast('Hesabın silindi.');
      });
      break;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 't-search') { S.q = el.value; const l = $('#t-list'); if (l) l.innerHTML = taskListHTML(); return; }
  if (el.dataset.f && D && el.closest('#ed-body') && el.type !== 'checkbox' && el.tagName !== 'SELECT' && el.type !== 'date' && el.type !== 'time') onEditorInput(el);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.f && D && el.closest('#ed-body') && (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date' || el.type === 'time')) onEditorInput(el);
  if (el.dataset.set) { S.data.settings[el.dataset.set] = el.checked; saveApp(); if (el.dataset.set === 'hideDone') render(); }
  if (el.id === 'import-file' && el.files[0]) { importData(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && layerStack.length && !layerStack[layerStack.length - 1].isStatic) closeLayer();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button][data-act]')) { ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Enter' && ev.target.id === 'f-title') { ev.preventDefault(); ev.target.blur(); }
});

// ---------- ticker: midnight rollover & reminders ----------
setInterval(() => {
  if (!S.me) return;
  const td = today();
  if (td !== S.lastToday) {
    if (S.sel === S.lastToday) S.sel = td;
    if (S.calSel === S.lastToday) S.calSel = td;
    S.lastToday = td; render(); return;
  }
  if (!S.data.settings.remind) return;
  const hm = nowHM();
  for (const it of dayItems(td, false)) {
    if (!it.time || isDone(it.v) || it.v === 's') continue;
    const nk = td + it.key;
    if (it.time <= hm && it.time >= addMin(hm, -2) && !S.notified[nk]) {
      S.notified[nk] = 1;
      const msg = `Zamanı geldi: ${it.t.title} (${it.time})`;
      toast(msg, { label: 'Yaptım', fn: () => toggleSlot(it.t.id, it.i, td) });
      try { navigator.vibrate && S.data.settings.vibrate && navigator.vibrate([60, 60, 60]); } catch {}
      notify(msg);
      if (S.view === 'today') render();
    }
  }
}, 20000);
function addMin(hm, n) { const [h, m] = hm.split(':').map(Number); const t = Math.max(0, h * 60 + m + n); return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) render(); });

// ============================================================
//   BOOT
// ============================================================
async function boot() {
  renderSplash();
  let db = null, user = null, uidv = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (user) uidv = await user.id();
    } catch (e) { console.warn(e); }
  }
  if (db && uidv) { S.mode = 'cloud'; S.db = db; S.base = 'data/users/' + uidv; S.scope = uidv; }
  else { S.mode = 'local'; S.scope = 'local'; }
  try { await loadAccounts(); }
  catch (e) { console.warn('cloud unavailable, falling back to device', e); S.mode = 'local'; S.scope = 'local'; S.db = null; await loadAccounts(); }
  const sess = readSession();
  const acc = sess && sess.scope === S.scope && S.accounts.find(a => a.id === sess.aid);
  if (acc) { try { await enter(acc); return; } catch (e) { console.error(e); } }
  auth.tab = S.accounts.length ? 'login' : 'register';
  renderAuth();
}
function notify(msg) {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted' || !document.hidden) return;
    const opts = { body: msg, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'ritim-' + msg };
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification('Ritim', opts)).catch(() => {});
    else new Notification('Ritim', opts);
  } catch {}
}
// Standalone (GitHub Pages) extras: offline cache, home-screen install, keep data from being evicted
if (!window.claude && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  });
}
boot();
</script>
